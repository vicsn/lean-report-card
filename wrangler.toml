name = "lean-report-card"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# The site is served as Workers static assets: a request matching a file under
# site/ is served without invoking the Worker, and everything else falls
# through to worker/index.js, which owns /api/*.
[assets]
directory = "./site"
binding = "ASSETS"

# FORM_FROM must be on a domain onboarded in Email Service > Email Sending.
# FORM_TO must be a verified destination address until that domain is
# onboarded; sends to verified destinations do not count against any quota.
[vars]
FORM_FROM = "info@leanreportcard.com"
FORM_TO = "forms@example.com"

[[send_email]]
name = "SEND_EMAIL"
allowed_destination_addresses = ["forms@example.com"]
