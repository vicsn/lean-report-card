[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lean-report-card"
version = "0.1.0"
description = "Local scoring of Lean 4 repositories into per-repository JSON reports"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lean Report Card contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-mock>=3.14,<4",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["lean_report_card"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lean_report_card"]
