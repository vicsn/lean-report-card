<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lean Report Card{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/site.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Lean Report Card</a>
    <span class="tagline">repeatable repository health checks for Lean</span>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Scores are mechanical checks on a pinned revision. Kernel acceptance, mathematical intent, security and maintainability are different properties.</p>
  </footer>
</body>
</html>
