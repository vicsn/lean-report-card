name = "lean-report-card"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# The site is served as Workers static assets: a request matching a file under
# site/ is served without invoking the Worker, and everything else falls
# through to worker/index.js, which owns /api/*.
[assets]
directory = "./site"
binding = "ASSETS"

# FORM_FROM must be on a domain with Email Routing (or Email Sending) enabled.
# FORM_TO is the notification mailbox and is deliberately not checked in: set
# it as a Worker secret, and in .dev.vars for local runs. On the Workers Free
# plan it must be a verified destination address in the account.
[vars]
FORM_FROM = "info@leanreportcard.com"

[[send_email]]
name = "SEND_EMAIL"
