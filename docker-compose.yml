name: lean-report-card

x-app-environment: &app-environment
  LRC_ENVIRONMENT: ${LRC_ENVIRONMENT:-development}
  LRC_PUBLIC_BASE_URL: ${LRC_PUBLIC_BASE_URL:-http://localhost}
  LRC_SECRET_KEY: ${LRC_SECRET_KEY:-development-only}
  LRC_DATABASE_URL: ${LRC_DATABASE_URL:-postgresql+psycopg://lrc:lrc@db:5432/lrc}
  LRC_REDIS_URL: ${LRC_REDIS_URL:-redis://redis:6379/0}
  LRC_ANALYZER_VERSION: ${LRC_ANALYZER_VERSION:-0.1.0}
  LRC_RUNNER_IMAGE: ${LRC_RUNNER_IMAGE:-lean-report-card-runner:local}
  LRC_RUNNER_MODE: ${LRC_RUNNER_MODE:-docker}
  LRC_GITHUB_TOKEN: ${LRC_GITHUB_TOKEN:-}
  LRC_BIG_REPO_THRESHOLD_KIB: ${LRC_BIG_REPO_THRESHOLD_KIB:-100000}
  LRC_KNOWN_BIG_REPOS: ${LRC_KNOWN_BIG_REPOS:-leanprover-community/mathlib4,leanprover/lean4}
  LRC_SMALL_TIMEOUT_SECONDS: ${LRC_SMALL_TIMEOUT_SECONDS:-1800}
  LRC_BIG_TIMEOUT_SECONDS: ${LRC_BIG_TIMEOUT_SECONDS:-7200}
  LRC_SMALL_MEMORY: ${LRC_SMALL_MEMORY:-4g}
  LRC_BIG_MEMORY: ${LRC_BIG_MEMORY:-12g}
  LRC_SMALL_CPUS: ${LRC_SMALL_CPUS:-2.0}
  LRC_BIG_CPUS: ${LRC_BIG_CPUS:-6.0}
  LRC_SMALL_LEAN_THREADS: ${LRC_SMALL_LEAN_THREADS:-2}
  LRC_BIG_LEAN_THREADS: ${LRC_BIG_LEAN_THREADS:-6}
  LRC_MAX_LOG_BYTES: ${LRC_MAX_LOG_BYTES:-1000000}
  LRC_RUNNER_NETWORK_MODE: ${LRC_RUNNER_NETWORK_MODE:-bridge}
  LRC_ELAN_CACHE_VOLUME: lrc_elan_cache
  LRC_LAKE_CACHE_VOLUME: lrc_lake_cache

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lrc
      POSTGRES_USER: lrc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lrc}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lrc -d lrc"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  runner-image:
    image: lean-report-card-runner:local
    build:
      context: .
      dockerfile: runner/Dockerfile
    command: ["true"]
    restart: "no"

  web:
    build: .
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/app/scripts/entrypoint-web.sh"]
    ports:
      - "127.0.0.1:8000:8000"

  worker-small:
    build: .
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      runner-image:
        condition: service_completed_successfully
    command:
      ["celery", "-A", "lean_report_card.worker:celery_app", "worker", "--loglevel=INFO", "--queues=small", "--concurrency=2", "--hostname=small@%h"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  worker-big:
    build: .
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      runner-image:
        condition: service_completed_successfully
    command:
      ["celery", "-A", "lean_report_card.worker:celery_app", "worker", "--loglevel=INFO", "--queues=big", "--concurrency=1", "--hostname=big@%h"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  elan_cache:
    name: lrc_elan_cache
  lake_cache:
    name: lrc_lake_cache
