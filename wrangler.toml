name = "lean-report-card"
compatibility_date = "2026-09-01"
pages_build_output_dir = "site"

# FORM_FROM must be on a domain onboarded in Email Service > Email Sending.
# FORM_TO must be a verified destination address while the account is on the
# Workers Free plan; arbitrary recipients need Workers Paid.
[vars]
FORM_FROM = "info@leanreportcard.com"
FORM_TO = "forms@example.com"

[[send_email]]
name = "SEND_EMAIL"
allowed_destination_addresses = ["forms@example.com"]
